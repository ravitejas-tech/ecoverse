<div style="background:#fff6ea;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;color:#1b1035">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border:2px solid #1b1035;border-radius:24px;box-shadow:5px 5px 0 #1b1035;overflow:hidden">
    <div style="background:#ff4f9a;border-bottom:2px solid #1b1035;padding:14px 24px;font-weight:800;letter-spacing:2px;text-transform:uppercase;font-size:12px">Echoverse Hub</div>
    <div style="padding:28px 24px">
      <h1 style="margin:0 0 12px;font-size:24px">Your login code</h1>
      <p style="margin:0 0 20px;font-size:16px;line-height:24px">Type this code on the My Tickets page to see your tickets.</p>
      <p style="margin:0 0 20px;font-size:36px;font-weight:800;letter-spacing:8px;background:#ffd43b;border:2px solid #1b1035;border-radius:16px;padding:12px;text-align:center">{{ .Token }}</p>
      <p style="margin:0;font-size:14px;line-height:22px;color:#4b3f6b">The code works for one hour. If you didn't ask for it, you can ignore this email.</p>
    </div>
  </div>
</div>
